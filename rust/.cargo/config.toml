[cache]
# Automatically prune Cargo's global cache on a regular cadence.
# This does not remove build artifacts under target/; use `cargo clean` for that.
auto-clean-frequency = "3 month"

[build]
# rustc 并行前端线程数(nightly 的 -Zthreads); 只对没有单独配置 rustflags 的 target 生效,
# 因为下面 target.*.rustflags 的优先级高于这里
rustflags = ["-Zthreads=8"]

[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-Zthreads=8",
  "-C",
  "link-arg=-Wl,-z,stack-size=8388608",
]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
  "-Zthreads=8",
  "-Clinker-flavor=ld.lld",
  "-C",
  "link-arg=-z",
  "-C",
  "link-arg=stack-size=8388608",
  "-C",
  "target-cpu=x86-64-v4",
]

[target.x86_64-pc-windows-msvc]
# lld 比 link.exe 快一个数量级; 若某个 crate 传入 lld 不认的链接参数, 删掉下面一行即可回退
linker = "rust-lld.exe"
rustflags = [
  "-Zthreads=8",
  "-C",
  "link-arg=/STACK:8388608",
]

[unstable]
gc = true
